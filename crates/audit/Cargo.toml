[package]
name = "audit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hash-chained Postgres audit log with OpenSearch shipping for ARES"

[dependencies]
agent-protocol = { path = "../agent-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
# Declared directly: the workspace sqlx spec requests a nonexistent `pgvector`
# feature (pgvector support comes from the separate `pgvector` crate).
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
