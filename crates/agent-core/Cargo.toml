[package]
name = "agent-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agent control loop, checkpointing, tool gateway and kill switch for ARES"

[dependencies]
async-nats.workspace = true
agent-protocol = { path = "../agent-protocol" }
llm-client = { path = "../llm-client" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
fastrand = "2"
# Declared directly: the workspace sqlx spec requests a nonexistent `pgvector`
# feature (pgvector support comes from the separate `pgvector` crate).
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
dashmap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
