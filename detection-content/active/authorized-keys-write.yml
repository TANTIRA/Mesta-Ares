title: SSH Authorized Keys Written (FIM)
id: 6e3a9c51-2d4f-4b7a-9e1c-8f5d3a7b2e41
status: stable
description: >-
  Detects additions/modifications to any authorized_keys file via Wazuh
  syscheck — SSH key persistence (T1098.004).
author: Mesta-Ares
date: 2026/10/29
logsource:
  product: wazuh
  service: syscheck
detection:
  selection:
    syscheck.path|endswith: '.ssh/authorized_keys'
    syscheck.event|contains:
      - 'modified'
      - 'added'
  condition: selection
falsepositives:
  - Provisioning/config management writing keys on first boot
level: high
tags:
  - attack.persistence
  - attack.t1098.004
