name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  sigma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install sigma-cli
      - run: sigma check detection-content/

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash evals/run.sh

  console:
    runs-on: ubuntu-latest
    # console is built by a parallel workstream; skip until package.json lands
    if: hashFiles('apps/console/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: corepack enable
      - run: pnpm -C apps/console install --frozen-lockfile=false
      - run: pnpm -C apps/console build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config -q
