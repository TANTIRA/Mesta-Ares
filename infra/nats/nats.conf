# NATS accounts — per-service credentials + subject allowlists (T-03).
# Passwords are dev defaults from ${VAR}; override via env in prod.
# nats-server expands $VAR / ${VAR} at load time.
authorization {
  users = [
    { user: ingest,       password: ${NATS_PASS_INGEST},       permissions: { publish: ["ares.triage"] } }
    { user: orchestrator, password: ${NATS_PASS_ORCH},         permissions: { publish: ["ares.>"], subscribe: ["ares.triage", "ares.vulns", "ares.bas", "ares.hunt", "ares.detection", "ares.respond"] } }
    { user: api,          password: ${NATS_PASS_API},          permissions: { publish: ["ares.>"], subscribe: ["ares.activity", "_INBOX.>"] } }
    { user: triage,       password: ${NATS_PASS_TRIAGE},       permissions: { publish: ["ares.respond", "ares.activity", "_INBOX.>"], subscribe: ["ares.triage"] } }
    { user: response,     password: ${NATS_PASS_RESPONSE},     permissions: { publish: ["ares.activity", "ares.dlq", "_INBOX.>"], subscribe: ["ares.respond"] } }
    { user: detection,    password: ${NATS_PASS_DETECTION},    permissions: { publish: ["ares.activity", "ares.dlq", "_INBOX.>"], subscribe: ["ares.detection"] } }
    { user: hunt,         password: ${NATS_PASS_HUNT},         permissions: { publish: ["ares.activity", "ares.dlq", "_INBOX.>"], subscribe: ["ares.hunt"] } }
    { user: vuln,         password: ${NATS_PASS_VULN},         permissions: { publish: ["ares.vulns", "ares.activity"], subscribe: [] } }
    { user: bas,          password: ${NATS_PASS_BAS},          permissions: { publish: ["ares.bas", "ares.activity"], subscribe: [] } }
  ]
}
