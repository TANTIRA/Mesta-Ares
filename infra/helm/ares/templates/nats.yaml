# NATS with JetStream persistence, single replica — dev-grade; use the
# official NATS helm chart or operator for HA.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ares.fullname" . }}-nats
  labels:
    {{- include "ares.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.nats.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ares.fullname" . }}-nats
  labels:
    app.kubernetes.io/name: nats
    {{- include "ares.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: nats}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        {{- include "ares.labels" . | nindent 8 }}
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-js", "-sd", "/data", "-m", "{{ .Values.nats.monitorPort }}"]
          ports:
            - {name: client, containerPort: {{ .Values.nats.port }}}
            - {name: monitor, containerPort: {{ .Values.nats.monitorPort }}}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ares.fullname" . }}-nats
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ares.fullname" . }}-nats
spec:
  selector: {app.kubernetes.io/name: nats}
  ports:
    - {name: client, port: {{ .Values.nats.port }}, targetPort: client}
    - {name: monitor, port: {{ .Values.nats.monitorPort }}, targetPort: monitor}
