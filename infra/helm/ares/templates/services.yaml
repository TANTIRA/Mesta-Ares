# One Deployment (+ optional Service) per entry in .Values.services.
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ares.fullname" $ }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "ares.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "ares.labels" $ | nindent 8 }}
    spec:
      {{- if $svc.controlWrite }}
      # The service user is uid 10001; fsGroup makes the control PVC
      # group-writable for the single read-write (api-server) mount.
      securityContext:
        fsGroup: 10001
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "ares.image" (dict "root" $ "name" $name "svc" $svc) }}
          imagePullPolicy: {{ $.Values.global.pullPolicy }}
          {{- if $svc.port }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "ares.fullname" $ }}-env
            - secretRef:
                name: ares-secrets
          {{- if $svc.env }}
          env:
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml ($svc.resources | default $.Values.resources) | nindent 12 }}
          {{- if or $svc.configVolumes $svc.control }}
          volumeMounts:
            {{- range $svc.configVolumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: {{ .readOnly | default true }}
            {{- end }}
            {{- if $svc.control }}
            # Kill-switch state: read-only for the gate and agents, the
            # api-server entry opts into read-write as the only writer.
            - name: control
              mountPath: /control
              readOnly: {{ hasKey $svc.control "readOnly" | ternary $svc.control.readOnly true }}
            {{- end }}
          {{- end }}
      {{- if or $svc.configVolumes $svc.control }}
      volumes:
        {{- range $svc.configVolumes }}
        - name: {{ .name }}
          configMap:
            name: {{ .configMap }}
        {{- end }}
        {{- if $svc.control }}
        - name: control
          persistentVolumeClaim:
            claimName: {{ include "ares.fullname" $ }}-control
        {{- end }}
      {{- end }}
{{- if $svc.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ares.fullname" $ }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "ares.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- end }}
{{- end }}
