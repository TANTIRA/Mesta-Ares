# Dev-grade in-cluster Postgres+pgvector. For prod, disable this and point
# DATABASE_URL (in ares-secrets) at a managed instance instead.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ares.fullname" . }}-postgres
  labels:
    {{- include "ares.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ares.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "ares.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        {{- include "ares.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{containerPort: {{ .Values.postgres.port }}}]
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.env.POSTGRES_USER | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.env.POSTGRES_DB | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: ares-secrets, key: POSTGRES_PASSWORD}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ares.fullname" . }}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ares.fullname" . }}-postgres
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{port: {{ .Values.postgres.port }}, targetPort: {{ .Values.postgres.port }}}]
