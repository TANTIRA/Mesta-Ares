# Plain-Kubernetes deployment of the Ares stack, as an alternative to
# `helm install`. Same service names, images and env as the chart, so the two
# can be compared side by side.
#
#   kubectl apply -k infra/k8s
#
# Prerequisites:
#   kubectl -n ares create namespace ares   # also handled by namespace.yaml
#   kubectl -n ares create secret generic ares-secrets --from-env-file=.env
#
# Content ConfigMaps are generated from the repo, so policies and detection
# rules stay single-sourced. Add a file to any of those directories and
# re-apply: the ConfigMap hash changes and the dependent pods roll.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ares

resources:
  - namespace.yaml
  - config.yaml
  - datastores.yaml
  - apps.yaml

generators:
  - policies-config.yaml
