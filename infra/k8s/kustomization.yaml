# Plain-Kubernetes deployment of the Ares stack, as an alternative to
# `helm install`. Same service names, images and env as the chart.
#
# Use `infra/k8s/apply.sh`, not a bare `kubectl apply -k`: the content
# ConfigMaps are created from the repo by the script (kustomize refuses to
# read files outside its own directory).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ares

resources:
  - namespace.yaml
  - config.yaml
  - datastores.yaml
  - apps.yaml
