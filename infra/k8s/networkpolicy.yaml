# Default-deny data plane: only labeled pods may reach the datastores and the
# message bus; HTTP services accept only from the api-gateway label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ares-default-deny
  namespace: ares
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ares-datastores
  namespace: ares
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [postgres, redis, opensearch, nats]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ares
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ares-http-edge
  namespace: ares
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [api-server, tool-server, ingestion-gateway]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
