apiVersion: apps/v1
kind: Deployment
metadata:
  name: ares-console
  labels:
    app.kubernetes.io/name: console
    app.kubernetes.io/part-of: ares
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console
        app.kubernetes.io/part-of: ares
    spec:
      containers:
        - name: console
          image: ghcr.io/your-org/ares-console:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # NEXT_PUBLIC_* is baked into the client bundle at BUILD time, so
            # the image must be built with the browser-reachable API URL. This
            # env only affects server-side rendering.
            - name: NEXT_PUBLIC_API_URL
              value: http://ares-api-server:8080
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
