# The 9 Rust binaries + console, mirroring the Helm chart's `services` map.
# Images follow the chart convention `ares-<service>:<tag>`.
#
# Services with an HTTP port get a Service + probes; the agents are NATS
# workers and expose nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ares-tool-server
  labels:
    app.kubernetes.io/name: tool-server
    app.kubernetes.io/part-of: ares
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tool-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tool-server
        app.kubernetes.io/part-of: ares
    spec:
      containers:
        - name: tool-server
          image: ghcr.io/your-org/ares-tool-server:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: ares-env
            - secretRef:
                name: ares-secrets
          env:
            - name: BIND_ADDR
              value: 0.0.0.0:8090
            - name: POLICIES_DIR
              value: /policies
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
      volumes:
        - name: policies
          configMap:
            name: ares-policies
---
apiVersion: v1
kind: Service
metadata:
  name: ares-tool-server
spec:
  selector:
    app.kubernetes.io/name: tool-server
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ares-api-server
  labels:
    app.kubernetes.io/name: api-server
    app.kubernetes.io/part-of: ares
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-server
        app.kubernetes.io/part-of: ares
    spec:
      containers:
        - name: api-server
          image: ghcr.io/your-org/ares-api-server:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ares-env
            - secretRef:
                name: ares-secrets
          env:
            # The code reads BIND_ADDR (the chart's API_BIND is dead).
            - name: BIND_ADDR
              value: 0.0.0.0:8080
          # /coverage scans `detection-content/active` relative to CWD.
          workingDir: /app
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: detection-active
              mountPath: /app/detection-content/active
              readOnly: true
      volumes:
        # Read-only copy: coverage reflects the committed rule set, not rules
        # the detection agent promoted into its PVC at runtime.
        - name: detection-active
          configMap:
            name: ares-detection-active
---
apiVersion: v1
kind: Service
metadata:
  name: ares-api-server
spec:
  selector:
    app.kubernetes.io/name: api-server
  ports:
    - name: http
      port: 8080
      targetPort: http
