# detection-agent writes into detection-content/{pending,active}, so it gets a
# writable PVC seeded once from the ConfigMap (ConfigMap mounts are read-only).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ares-detection-content
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ares-detection-agent
  labels:
    app.kubernetes.io/name: detection-agent
    app.kubernetes.io/part-of: ares
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: detection-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detection-agent
        app.kubernetes.io/part-of: ares
    spec:
      initContainers:
        - name: seed
          image: busybox:1.36
          # -n: never overwrite rules the agent already promoted.
          command: ["sh", "-c", "cp -rn /seed/. /data/"]
          volumeMounts:
            - name: seed-active
              mountPath: /seed/active
              readOnly: true
            - name: seed-pending
              mountPath: /seed/pending
              readOnly: true
            - name: data
              mountPath: /data
      containers:
        - name: detection-agent
          image: ghcr.io/your-org/ares-detection-agent:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ares-env
            - secretRef:
                name: ares-secrets
          # The pipeline uses relative paths (`detection-content/pending`).
          workingDir: /app
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /app/detection-content
      volumes:
        - name: seed-active
          configMap:
            name: ares-detection-active
        - name: seed-pending
          configMap:
            name: ares-detection-pending
        - name: data
          persistentVolumeClaim:
            claimName: ares-detection-content
---
