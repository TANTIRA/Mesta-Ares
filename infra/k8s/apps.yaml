---
# Single entry point in front of api-server / ingestion-gateway / tool-server.
# GATEWAY_API_KEYS comes from ares-secrets; without it the gateway fails closed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ares-api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: ares
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: ares
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/your-org/ares-api-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: ares-env
            - secretRef:
                name: ares-secrets
          env:
            - name: GATEWAY_BIND
              value: 0.0.0.0:8082
            - name: GATEWAY_API_UPSTREAMS
              value: http://ares-api-server:8080
            - name: GATEWAY_INGEST_UPSTREAMS
              value: http://ares-ingestion-gateway:8091
            - name: GATEWAY_TOOLS_UPSTREAMS
              value: http://ares-tool-server:8090
            - name: POLICIES_DIR
              value: /policies
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
      volumes:
        - name: policies
          configMap:
            name: ares-policies
---
apiVersion: v1
kind: Service
metadata:
  name: ares-api-gateway
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8082
      targetPort: http
