# Tool allowlist for the agentic SOAR layer.
# Deny-by-default: a tool absent from this file cannot be invoked.
# `impact`: read | write | high   `autonomy`: auto | approval | deny
# `aliases` maps accepted alternative argument names to the canonical key the
# executor reads; the gateway renames them before `args_schema` validation.
# autonomy=approval returns `approval_required` without executing: a human
# must clear the call. Only the MISP write tools require approval; everything
# else enabled here runs `auto`.
version: 1

tools:
  # ---- read-only / enrichment ----
  opensearch.query:
    impact: read
    aliases:
      query_string: q
    autonomy: auto
  thehive.case.create:
    impact: write
    autonomy: auto
  thehive.case.update:
    impact: write
    aliases:
      id: case_id
    autonomy: auto
  thehive.observable.add:
    impact: write
    aliases:
      id: case_id
    autonomy: auto
  cortex.analyzer.run:
    impact: read
    aliases:
      analyzer: analyzer_id
      dataType: data_type
      observable: data
    autonomy: auto
  misp.search:
    impact: read
    aliases:
      ioc: value
      query: value
    autonomy: auto
  misp.attribute.search:
    impact: read
    aliases:
      ioc: value
      query: value
    autonomy: auto
    args_schema:
      type: object
      properties:
        value: { type: string, minLength: 1, maxLength: 2048 }
        limit: { type: integer, minimum: 1, maximum: 500 }
      required: [value]
      additionalProperties: false
  misp.event.view:
    impact: read
    aliases:
      id: event_id
    autonomy: auto
    args_schema:
      type: object
      properties:
        event_id: { type: string, pattern: '^[0-9]+$' }
      required: [event_id]
      additionalProperties: false
  misp.warninglist.check:
    impact: read
    aliases:
      ioc: value
    autonomy: auto
  misp.sighting.add:
    impact: write
    aliases:
      ioc: value
    autonomy: approval
  misp.attribute.add:
    impact: write
    autonomy: approval
  virustotal.lookup:
    impact: read
    aliases:
      value: ioc
      ip: ioc
      domain: ioc
      hash: ioc
      url: ioc
    autonomy: auto
  abuseipdb.check:
    impact: read
    aliases:
      value: ioc
      ip: ioc
    autonomy: auto
  shodan.host:
    impact: read
    aliases:
      value: ioc
      ip: ioc
    autonomy: auto
  greynoise.ip:
    impact: read
    aliases:
      value: ioc
      ip: ioc
    autonomy: auto
  urlscan.submit:
    impact: read
    aliases:
      value: ioc
      url: ioc
    autonomy: auto
  osquery.fleet_query:
    impact: read
    autonomy: auto
  wazuh.agent.list:
    impact: read
    autonomy: auto
  nvd.lookup_cve:
    impact: read
    aliases:
      id: cve_id
      cve: cve_id
    autonomy: auto
    args_schema:
      type: object
      properties:
        cve_id: { type: string, pattern: '^CVE-[0-9]{4}-[0-9]{4,7}$' }
      required: [cve_id]
      additionalProperties: false
  nvd.cve_history:
    impact: read
    aliases:
      id: cve_id
      cve: cve_id
    autonomy: auto
    args_schema:
      type: object
      properties:
        cve_id: { type: string, pattern: '^CVE-[0-9]{4}-[0-9]{4,7}$' }
      required: [cve_id]
      additionalProperties: false
  nvd.recent_cves:
    impact: read
    aliases:
      q: keyword
    autonomy: auto
    args_schema:
      type: object
      properties:
        days: { type: integer, minimum: 1, maximum: 120 }
        keyword: { type: string, maxLength: 200 }
        cvss_v3_severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        cvss_v4_severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        has_kev: { type: boolean }
      additionalProperties: false
  cvss.score:
    impact: read
    aliases:
      cvss_vector: vector
    autonomy: auto
    args_schema:
      type: object
      properties:
        vector: { type: string, pattern: '^CVSS:(3\.[01]|4\.0)/' }
      required: [vector]
      additionalProperties: false

  # ---- response actions (reversible) ----
  blocklist.ip.add:
    impact: write
    autonomy: auto
    args_schema:
      type: object
      properties:
        ip: { type: string, format: ipv4 }
        duration_minutes: { type: integer, minimum: 5, maximum: 10080 }
      required: [ip]
      additionalProperties: false
    forbidden_args:
      ip: [RFC1918, loopback, multicast] # evaluated in code
  blocklist.domain.add:
    impact: write
    autonomy: auto
    args_schema:
      type: object
      properties:
        domain: { type: string, maxLength: 253 }
        duration_minutes: { type: integer, minimum: 5, maximum: 10080 }
      required: [domain]
      additionalProperties: false
  misp.ioc.block:
    impact: write
    autonomy: approval

  # ---- response actions (high impact, still autonomous but radius-capped) ----
  wazuh.active_response.isolate_host:
    impact: high
    autonomy: auto
    blast_radius: { max_per_hour: 5, cooldown_minutes: 10 }
    args_schema:
      type: object
      properties:
        agent_id: { type: string, pattern: '^[0-9]{3,}$' }
        duration_minutes: { type: integer, minimum: 5, maximum: 1440 }
      required: [agent_id]
      additionalProperties: false
  wazuh.active_response.kill_process:
    impact: high
    autonomy: auto
    blast_radius: { max_per_hour: 20 }
    args_schema:
      type: object
      properties:
        agent_id: { type: string }
        pid: { type: integer, minimum: 1 }
      required: [agent_id, pid]
      additionalProperties: false
  entra.user.revoke_sessions:
    impact: high
    aliases:
      id: user_id
    autonomy: auto
    blast_radius: { max_per_hour: 10 }
    args_schema:
      type: object
      properties:
        user_id: { type: string, format: uuid }
      required: [user_id]
      additionalProperties: false
  entra.user.disable:
    impact: high
    aliases:
      id: user_id
    autonomy: auto
    blast_radius: { max_per_hour: 5 }
    args_schema:
      type: object
      properties:
        user_id: { type: string, format: uuid }
      required: [user_id]
      additionalProperties: false
  ad.user.disable:
    impact: high
    autonomy: auto
    blast_radius: { max_per_hour: 5 }
    args_schema:
      type: object
      properties:
        sam_account_name: { type: string, maxLength: 20 }
      required: [sam_account_name]
      additionalProperties: false
  o365.email.quarantine:
    impact: high
    autonomy: auto
    blast_radius: { max_per_hour: 50 }
    args_schema:
      type: object
      properties:
        message_id: { type: string }
      required: [message_id]
      additionalProperties: false
  firewall.rule.add:
    impact: high
    autonomy: auto
    blast_radius: { max_per_hour: 20 }
    args_schema:
      type: object
      properties:
        direction: { type: string, enum: [inbound, outbound] }
        remote: { type: string }
        action: { type: string, enum: [deny] }
        duration_minutes: { type: integer, minimum: 5, maximum: 1440 }
      required: [direction, remote, action]
      additionalProperties: false

  # ---- compensating actions (rollback targets recorded by response-agent) ----
  # Same impact class as the action they undo; autonomy stays `auto` because
  # they restore prior state rather than extending blast radius.
  blocklist.ip.remove:
    impact: write
    autonomy: auto
    args_schema:
      type: object
      properties:
        ip: { type: string, format: ipv4 }
      required: [ip]
      additionalProperties: false
  blocklist.domain.remove:
    impact: write
    autonomy: auto
    args_schema:
      type: object
      properties:
        domain: { type: string, maxLength: 253 }
      required: [domain]
      additionalProperties: false
  firewall.rule.remove:
    impact: high
    autonomy: auto
    blast_radius: { max_per_hour: 20 }
    args_schema:
      type: object
      properties:
        remote: { type: string }
      required: [remote]
      additionalProperties: false
  wazuh.active_response.unisolate_host:
    impact: high
    autonomy: auto
    blast_radius: { max_per_hour: 5, cooldown_minutes: 10 }
    args_schema:
      type: object
      properties:
        agent_id: { type: string, pattern: '^[0-9]{3,}$' }
      required: [agent_id]
      additionalProperties: false
  entra.user.enable:
    impact: high
    aliases:
      id: user_id
    autonomy: auto
    blast_radius: { max_per_hour: 5 }
    args_schema:
      type: object
      properties:
        user_id: { type: string, format: uuid }
      required: [user_id]
      additionalProperties: false
  ad.user.enable:
    impact: high
    autonomy: auto
    blast_radius: { max_per_hour: 5 }
    args_schema:
      type: object
      properties:
        sam_account_name: { type: string, maxLength: 20 }
      required: [sam_account_name]
      additionalProperties: false
  o365.email.release:
    impact: high
    autonomy: auto
    blast_radius: { max_per_hour: 50 }
    args_schema:
      type: object
      properties:
        message_id: { type: string }
      required: [message_id]
      additionalProperties: false
  misp.ioc.unblock:
    impact: write
    autonomy: approval

  # ---- detection-as-code ----
  detection.sigma.deploy:
    impact: write
    autonomy: auto
    args_schema:
      type: object
      properties:
        rule_path: { type: string, pattern: '^detection-content/' }
        backtest_fp_max: { type: integer, minimum: 0 }
      required: [rule_path]
      additionalProperties: false

  # ---- notifications ----
  notify.slack.post:
    impact: write
    autonomy: auto

  # ---- dynamic command execution ----
  # Runs inside an NVIDIA OpenShell sandbox (see executors/openshell.rs) —
  # the sandbox is defense-in-depth; this schema is the gate. `command` is
  # enum-allowlisted to the BAS/exec surface; args are plain argv entries
  # (no shell metacharacters — the executor rejects ; && | ` $() anyway).
  # Needs a reachable openshell gateway; fails closed ("sandbox unavailable")
  # when absent. Non-exec tools are unaffected.
  exec.sandbox:
    impact: high
    # Sandbox is the boundary, but exec goes through human approval —
    # bash/python3 in the allowlist make it arbitrary code by design.
    autonomy: approval
    blast_radius: { max_per_hour: 20, cooldown_minutes: 1 }
    args_schema:
      type: object
      properties:
        command: { type: string, enum: [bash, sshpass, python3, echo] }
        args:
          type: array
          items: { type: string, maxLength: 1024 }

  exec.bas.run:
    impact: high
    autonomy: approval
    args_schema:
      type: object
      properties:
        command: { type: string, enum: [bash, sshpass, python3, echo] }
        args:
          type: array
          items: { type: string, maxLength: 1024 }
          maxItems: 8
      required: [command]
      additionalProperties: false

  # ---- explicitly denied (kept for documentation) ----
  host.shutdown:
    impact: high
    autonomy: deny
  user.delete:
    impact: high
    autonomy: deny
  siem.index.delete:
    impact: high
    autonomy: deny
